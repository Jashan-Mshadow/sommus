<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sommus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(14, 20, 34, .66);
    --line: rgba(120, 190, 255, .16);
    --text: #dbe7f5;
    --dim: #6f819a;
    --cyan: #5ee7ff;
    --violet: #a58bff;
    --amber: #ffcf7a;
    --green: #6dffb0;
    --red: #ff7a8a;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(900px 600px at 30% 20%, rgba(94, 231, 255, .07), transparent 60%),
      radial-gradient(700px 500px at 85% 80%, rgba(165, 139, 255, .08), transparent 60%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
  }
  .app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: 56px minmax(0, 1fr); }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 22px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  .brand { font-weight: 600; letter-spacing: .42em; font-size: 14px; color: var(--cyan); text-shadow: 0 0 18px rgba(94, 231, 255, .55); }
  .chips { display: flex; gap: 8px; margin-left: auto; -webkit-app-region: no-drag; }
  .chip { font: 11px var(--mono); letter-spacing: .08em; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); display: flex; align-items: center; gap: 7px; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); box-shadow: 0 0 0 transparent; transition: .3s; }
  .chip.on { color: var(--text); }
  .chip.on i { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .chip.bad i { background: var(--red); box-shadow: 0 0 10px var(--red); }

  main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; padding: 0 28px 22px; }
  .stage { position: relative; min-height: 0; display: grid; grid-template-rows: minmax(180px, 1.1fr) minmax(0, 1fr); }
  .orbwrap { position: relative; min-height: 0; display: grid; place-items: center; }
  canvas { width: 100%; height: 100%; display: block; }
  .statelabel { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font: 11px var(--mono); letter-spacing: .5em; color: var(--dim); text-transform: uppercase; transition: color .4s; }
  .statelabel.listening { color: var(--cyan); } .statelabel.thinking { color: var(--violet); } .statelabel.speaking { color: var(--amber); }

  .log { overflow-y: auto; padding: 8px 4px 14px; scroll-behavior: smooth; mask-image: linear-gradient(transparent, #000 24px); -webkit-mask-image: linear-gradient(transparent, #000 24px); }
  .log::-webkit-scrollbar, .feed::-webkit-scrollbar { width: 6px; } .log::-webkit-scrollbar-thumb, .feed::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .msg { max-width: 78%; margin: 10px 0; padding: 11px 15px; border-radius: 14px; line-height: 1.5; font-size: 15px; animation: rise .35s ease both; white-space: pre-wrap; }
  .msg.you { margin-left: auto; background: rgba(94, 231, 255, .09); border: 1px solid rgba(94, 231, 255, .25); }
  .msg.sommus { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 28px rgba(165, 139, 255, .07); backdrop-filter: blur(8px); }
  .msg small { display: block; font: 10px var(--mono); letter-spacing: .2em; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  form { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); backdrop-filter: blur(10px); transition: border-color .3s, box-shadow .3s; }
  form:focus-within { border-color: rgba(94, 231, 255, .5); box-shadow: 0 0 30px rgba(94, 231, 255, .12); }
  input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: 16px var(--sans); padding: 10px 12px; }
  input::placeholder { color: var(--dim); }
  button { cursor: pointer; border: 1px solid var(--line); background: rgba(94, 231, 255, .06); color: var(--cyan); border-radius: 12px; height: 42px; min-width: 42px; padding: 0 14px; font: 12px var(--mono); letter-spacing: .12em; transition: .25s; }
  button:hover { background: rgba(94, 231, 255, .16); box-shadow: 0 0 18px rgba(94, 231, 255, .25); }
  button.mic.on { background: rgba(255, 122, 138, .14); color: var(--red); border-color: rgba(255, 122, 138, .5); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 22px rgba(255, 122, 138, .45); } }

  aside { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: rgba(5, 8, 15, .5); }
  aside h2 { margin: 0; padding: 16px 18px 10px; font: 11px var(--mono); letter-spacing: .3em; color: var(--dim); font-weight: 500; display: flex; justify-content: space-between; }
  aside h2 span { color: var(--green); }
  .feed { overflow-y: auto; padding: 0 18px 18px; font: 12px/1.65 var(--mono); }
  .ln { opacity: .92; word-break: break-word; animation: rise .25s ease both; }
  .ln.tool { color: var(--cyan); } .ln.voice { color: #9fb2cc; } .ln.system { color: var(--violet); }
  .ln time { color: var(--dim); margin-right: 8px; }
  .cursor::after { content: "▍"; color: var(--cyan); animation: blink 1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">SOMMUS</div>
    <div class="chips">
      <div class="chip" id="chipBrain"><i></i>BRAIN</div>
      <div class="chip" id="chipVoice"><i></i>VOICE</div>
    </div>
  </header>

  <main>
    <div class="stage">
      <div class="orbwrap"><canvas id="orb"></canvas><div class="statelabel" id="stateLabel">idle</div></div>
      <div class="log" id="log"></div>
    </div>
    <form id="form" autocomplete="off">
      <button type="button" class="mic" id="mic" title="Voice mode (runs the wake word and microphone)">MIC</button>
      <input id="text" placeholder="Talk to Sommus…" autofocus>
      <button type="submit">SEND</button>
    </form>
  </main>

  <aside>
    <h2>ACTIVITY <span id="live">●</span></h2>
    <div class="feed" id="feed"><div class="cursor"></div></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), feed = $("feed"), input = $("text");
let state = "idle", voice = false;

// ---------- orb ----------
const cv = $("orb"), g = cv.getContext("2d");
let W = 0, H = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
function fit() { const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
new ResizeObserver(fit).observe(cv); fit();

const palette = { idle: [94, 231, 255], listening: [94, 231, 255], thinking: [165, 139, 255], speaking: [255, 207, 122] };
const feel = { idle: [0.35, 0.5], listening: [0.7, 1.1], thinking: [1.0, 3.2], speaking: [1.35, 2.0] }; // [energy, speed]
let energy = 0.35, speed = 0.5, color = [94, 231, 255], t = 0;

function draw() {
  const [tE, tS] = feel[state] || feel.idle, tC = palette[state] || palette.idle;
  energy += (tE - energy) * 0.05; speed += (tS - speed) * 0.05;
  color = color.map((c, i) => c + (tC[i] - c) * 0.06);
  t += 0.016 * speed;
  g.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.3;
  const [r, gr, b] = color.map(Math.round), rgba = (a) => `rgba(${r},${gr},${b},${a})`;

  const glow = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * (2.1 + energy * 0.5));
  glow.addColorStop(0, rgba(0.22 * energy + 0.08)); glow.addColorStop(1, rgba(0));
  g.fillStyle = glow; g.fillRect(0, 0, W, H);

  const core = g.createRadialGradient(cx - R * 0.2, cy - R * 0.25, R * 0.05, cx, cy, R);
  core.addColorStop(0, "rgba(255,255,255,.95)"); core.addColorStop(0.35, rgba(0.9)); core.addColorStop(1, rgba(0.05));
  g.fillStyle = core; g.beginPath(); g.arc(cx, cy, R * (0.55 + 0.04 * Math.sin(t * 2.2) * energy), 0, 7); g.fill();

  g.lineWidth = 1.4;
  for (let k = 0; k < 5; k++) {
    g.beginPath();
    const base = R * (0.8 + k * 0.17), amp = R * 0.05 * energy * (1 + k * 0.4), ph = t * (1 + k * 0.35) * (k % 2 ? -1 : 1);
    for (let a = 0; a <= 6.2832 + 0.05; a += 0.04) {
      const n = Math.sin(a * (3 + k) + ph * 2) * 0.6 + Math.sin(a * (5 + k) - ph * 3) * 0.4;
      const rad = base + n * amp + (state === "thinking" ? Math.sin(a * 9 + t * 8) * R * 0.012 : 0);
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      a === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.strokeStyle = rgba(0.65 - k * 0.1); g.stroke();
  }
  // orbiting sparks
  for (let i = 0; i < 18; i++) {
    const a = t * (0.5 + (i % 3) * 0.25) + i * 0.35, rad = R * (1.7 + 0.25 * Math.sin(i * 2.1 + t));
    g.fillStyle = rgba(0.15 + 0.5 * ((i * 7) % 10) / 10);
    g.beginPath(); g.arc(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * 0.62, 1.4 + (i % 3) * 0.6, 0, 7); g.fill();
  }
  requestAnimationFrame(draw);
}
draw();

// ---------- ui ----------
function setState(s) { state = s; const el = $("stateLabel"); el.textContent = s; el.className = "statelabel " + s; }
function setVoice(on) { voice = on; $("mic").classList.toggle("on", on); $("chipVoice").className = "chip" + (on ? " on" : ""); $("mic").textContent = on ? "STOP" : "MIC"; }
function addMsg(who, text) {
  const d = document.createElement("div"); d.className = "msg " + who;
  const s = document.createElement("small"); s.textContent = who === "you" ? "you" : "sommus";
  d.append(s, document.createTextNode(text)); log.append(d); log.scrollTop = log.scrollHeight;
}
function addLine(text, source) {
  const d = document.createElement("div"); d.className = "ln " + (source || "");
  const tm = document.createElement("time"); tm.textContent = new Date().toTimeString().slice(0, 8);
  d.append(tm, document.createTextNode(text));
  feed.insertBefore(d, feed.querySelector(".cursor")); feed.scrollTop = feed.scrollHeight;
  while (feed.children.length > 400) feed.removeChild(feed.firstChild);
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  input.value = "";
  fetch("/api/say", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })
    .catch(() => addLine("could not reach the app server", "system"));
});
$("mic").addEventListener("click", () => {
  fetch("/api/voice", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on: !voice }) })
    .then((r) => r.json()).then((j) => setVoice(j.voice));
});

const es = new EventSource("/api/events");
es.onopen = () => { $("live").style.color = "var(--green)"; };
es.onerror = () => { $("live").style.color = "var(--red)"; };
es.onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.kind === "state") setState(e.state);
  else if (e.kind === "you") addMsg("you", e.text);
  else if (e.kind === "sommus") addMsg("sommus", e.text);
  else if (e.kind === "line") addLine(e.text, e.source);
  else if (e.kind === "voice") setVoice(e.on);
};

async function poll() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("chipBrain").className = "chip " + (s.brain ? "on" : "bad");
    if (s.voice !== voice) setVoice(s.voice);
  } catch { $("chipBrain").className = "chip bad"; }
}
poll(); setInterval(poll, 8000);
addLine("Sommus app ready. Type below, or press MIC for voice.", "system");
</script>
</body>
</html>
