[project]
name = "sommus"
version = "0.1.0"
description = "Sommus — a personal assistant that controls my devices, built on an LLM agent loop and MCP."
readme = "README.md"
authors = [
    { name = "Jashan Multani", email = "jashandeepm2008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "en-core-web-sm",
    "httpx2>=2.12.0",
    "mcp[cli]>=2.2.0",
    "misaki[en]>=0.9.4",
    "mlx-audio[tts]>=0.5.4",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "prompt-toolkit>=3.0.53",
    "pymupdf>=1.28.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
sommus = "sommus.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
