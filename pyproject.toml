[project]
name = "sommus"
version = "0.1.0"
description = "Sommus — a personal assistant that controls my devices, built on Claude and MCP."
readme = "README.md"
authors = [
    { name = "Jashan Multani", email = "jashandeepm2008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "mcp[cli]>=2.2.0",
    "prompt-toolkit>=3.0.53",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
sommus = "sommus.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
