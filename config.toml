[assistant]
name = "Sommus"
user = "Jashan"
model = "claude-sonnet-5"
# low | medium | high | xhigh | max — lower is faster and cheaper.
# Sonnet 5 + low chosen 2026-09-14 for cost; see the eval numbers in the vault plan.
effort = "low"
# Soft step budget: Sommus is warned when it's running low, and takes more if it
# genuinely needs them (announced). max_steps_hard is the real ceiling.
max_steps = 20
max_steps_hard = 60
# The server-side search tool is off: attached to every request it was 2,440 tokens (~30% of
# the prompt). Search now lives in the "web" node below and only costs anything when used.
web_search = false
# Only these tools are sent with every request. The rest are found on demand by tool
# search, so the prompt stays small — 59 full tool definitions cost ~7k tokens a step.
core_tools = [
    "get_battery", "get_volume", "set_volume", "set_mute", "set_brightness", "list_apps", "open_app",
    "quit_app", "open_url", "media_control", "notify", "set_reminder", "create_reminder", "find_contact", "send_message",
    "send_email", "search_email", "search_vault", "read_note", "add_todo", "complete_todo", "web_search", "ask_claude",
    # quick spoken requests: deferred, each first cost a tool search (~2 s before the tool ran)
    "get_now_playing", "get_brightness", "lock_screen", "sleep_display", "get_wifi", "list_browser_tabs",
    "close_browser_tabs",
    # the SwitchBot plug (lamp): "turn the lamp off when I leave" goes to the model, no tool search first
    "plug_on", "plug_off", "plug_status", "ble_plug_on", "ble_plug_off", "ble_plug_status", "schedule_plug",
    # long-term memory: offered on every turn so a fact gets saved without a tool search first
    "remember",
]
# Conversation memory: older turns beyond this are dropped so every request doesn't
# keep re-sending the whole day. /new clears it entirely.
history_turns = 12
# Simple fixed commands ("brightness 20", "mute", "pause", "lock") run locally with no model
# call at all — free and instant. Anything less exact still goes to the model.
fast_path = true

# Each node is an MCP server, launched as `python -m <module>`.
[[nodes]]
name = "laptop"
where = "mac"
module = "sommus.nodes.laptop.server"
# Quitting the terminal Sommus runs in would kill Sommus mid-command.
env = { SOMMUS_PROTECT_APPS = "Terminal,iTerm2,Ghostty,Warp,Alacritty,kitty,Claude,Code,Cursor" }

[safety]
# false: Sommus acts without asking (Jashan's choice, 2026-09-14).
# true: destructive tools (quit_app, sleep_computer...) wait for a y/N first.
ask_before_destructive = false

# Needs GMAIL_ADDRESS and GMAIL_APP_PASSWORD in .env (app password, not the account
# password). Until then its tools just explain the setup; everything else keeps working.
[[nodes]]
name = "gmail"
module = "sommus.nodes.gmail.server"
env = { GMAIL_ADDRESS = "${GMAIL_ADDRESS}", GMAIL_APP_PASSWORD = "${GMAIL_APP_PASSWORD}" }

# Web search through a cheap worker model; results stay in its context, a short answer comes back.
[[nodes]]
name = "web"
module = "sommus.nodes.web.server"
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}" }

# Claude Code on this Mac, on the subscription: Google Calendar, Drive, Notion, Goodnotes, its memory of Jashan.
# Full rights (Jashan, 2026-09-15); ask_claude is behind the PIN in [security].
[[nodes]]
name = "claude"
where = "mac"
module = "sommus.nodes.claude.server"
env = { SOMMUS_CLAUDE_MODEL = "sonnet", SOMMUS_CLAUDE_CWD = "~/Documents" }

# Gemini and ChatGPT on Jashan's free sign-ins (Gemini CLI, Codex CLI). Also registered with Claude Code.
[[nodes]]
name = "bridge"
where = "mac"
module = "sommus.nodes.bridge.server"

# Smart plugs through the SwitchBot cloud (fan, lamp): works from anywhere, no hub, no Mac. Needs SWITCHBOT_TOKEN + SWITCHBOT_SECRET
# in .env, on the server too. Until then the tools are not offered and the Mac's Bluetooth does the job (Tuya removed 2026-11-17).
[[nodes]]
name = "home"
module = "sommus.nodes.home.server"
env = { SWITCHBOT_TOKEN = "${SWITCHBOT_TOKEN}", SWITCHBOT_SECRET = "${SWITCHBOT_SECRET}" }

[[nodes]]
name = "vault"
module = "sommus.nodes.vault.server"
env = { SOMMUS_VAULT_PATH = "~/Documents/Jashans_Brain", SOMMUS_MEMORY_PATH = "~/Documents/Jashans_Brain/Sommus Memory.md", SOMMUS_DIARY_PATH = "~/Documents/Jashans_Brain/Sommus Diary.md" }

[memory]
# Facts Sommus saves itself ("remember my gym days are..."), loaded into every prompt. Private: in the vault.
path = "~/Documents/Jashans_Brain/Sommus Memory.md"
# What happened each day, distilled overnight from the conversation log by the cheap model (~1¢ a night, $0 on a
# day with no conversation). The last few days and open follow-ups go into the prompt (docs/decisions/0011).
diary = "~/Documents/Jashans_Brain/Sommus Diary.md"
diary_at = "03:30"                   # in the schedule's time zone; a run before noon writes up the day before
diary_model = "claude-haiku-4-5"

# Override any tool's permission tier: "read" | "reversible" | "destructive" | "blocked"
[permissions]
# Jashan's call (2026-09-14): Sommus never asks, for anything, on any device.
# Outward-facing actions (send_message, send_email) run like the rest; compose_email only opens a draft.
# The "always_ask" tier still exists in code if a future tool ever earns it.

[security]
# Personal actions wait for Jashan's PIN until Sommus recognises his voice (2026-09-15).
# Set it with `sommus pin` (only a salted hash is stored). Say or type it to unlock; /lock locks again,
# and so does locking or sleeping the Mac. Anything not listed — volume, music, apps, weather — never asks.
unlock_minutes = 10
pin_tools = [
    # accounts and people
    "ask_claude", "ask_gemini", "ask_gpt", "search_email", "read_email", "send_email", "reply_to_email", "draft_email", "mark_email_read",
    "send_message", "compose_email", "find_contact", "list_contacts", "read_messages",
    # notes: reading his own notes is unlocked (Jashan, 2026-09-19) — the PIN prompt interrupted
    # "what's on my to-do list" mid-conversation. Writing them still waits for the PIN.
    "append_to_note", "add_todo", "complete_todo", "commit_vault",
    # files, clipboard, browser contents
    "read_file", "find_files", "append_to_file", "open_file", "read_pdf", "download_url", "get_clipboard",
    "list_browser_tabs", "read_browser_tab", "list_page_links", "click_page_link", "list_embedded_files",
    "save_browser_tab",
    # anything that could do all of the above another way
    "run_shell", "type_text", "press_keys", "click", "screenshot",
]

[mac_queue]
# On the server, while the Mac sleeps: these wait there and run when it wakes, with a Telegram message once done.
# Only small things that can as well happen later. Code refuses anything personal ([security] pin_tools) or not
# in the reversible tier, whatever this list says; anything older than `hours` is dropped, not run.
tools = ["create_reminder", "open_url", "open_app", "notify"]
hours = 24

[voice]
# Spoken, course codes become subjects: "ECE105 LEC 001" -> "physics lecture". The screen keeps the codes.
say_as = { "ECE 150" = "programming", "ECE 105" = "physics", "ECE 190" = "engineering profession", "ECE 198" = "project studio", "MATH 115" = "linear algebra", "MATH 117" = "calculus", "COMMST 192" = "communications", "GENE 119" = "engineering seminar" }
engine = "kokoro"                               # "kokoro" = natural, free, runs on the Mac · "say" = built-in macOS voice
kokoro_voice = "bf_isabella"                    # picked by ear; af_heart a close second · hear others: `sommus voices`
speed = 1.0                                     # 1.1 talks a little faster
kokoro_model = "mlx-community/Kokoro-82M-bf16"  # ~330 MB, downloaded once
# Fallback if Kokoro can't load. Any installed macOS voice: `say -v '?'`.
say_voice = "Samantha (Enhanced)"
say_rate = 190                                  # words per minute
stt_model = "mlx-community/whisper-small.en-mlx"  # runs on the M1, ~0.35s per command
silence_seconds = 0.7                           # how long a pause ends what you're saying
hold_seconds = 2.0                              # ...unless it stopped mid-thought ("remind me to"): wait this long for the rest
wake_phrases = ["sommus", "hey sommus", "what's up sommus", "yo sommus", "hey jarvis"]  # at the start or end of what's said
# Live mode also listens with a wake-word model (openWakeWord, on the Mac, ~1 ms per 80 ms of audio). It hears the
# sound, not Whisper's spelling, so it doesn't miss. Pretrained phrase: "Hey Jarvis". "" turns it off; a custom
# "Hey Sommus" model goes here once trained. Raise wake_threshold toward 0.7 if it wakes by itself.
wake_model = "hey_jarvis_v0.1.onnx"
wake_threshold = 0.5
awake_seconds = 30                              # after a reply, how long it keeps listening without the wake phrase
                                                # (10 was too short mid-conversation: he had to say the name again)
awake_after_question = 90                       # ...and this long when Sommus ended its reply with a question
barge_in = true                                 # talk over Sommus to stop it (macOS echo cancellation)
# Interrupt only when it hears its name ("Sommus, stop"), not on any voice. Sommus keeps listening while it
# talks, so a roommate — or its own voice coming back — can't cut it off (Jashan's call, 2026-09-19).
barge_in_needs_name = true
barge_in_mic_gain = 2.0                         # echo cancellation halves the mic level; put it back
room_filter = true                              # awake, check with a fast model that speech was meant for Sommus
vad_threshold = 0.35                            # speech detector; raise toward 0.6 if noise keeps waking Whisper,
                                                # lower toward 0.25 if it misses you from across the room
# Smart Turn (open source, runs on the Mac, ~55 ms): at a short pause it judges from his tone whether he's
# finished. Yes ends the utterance at turn_check_seconds; "not yet" waits up to turn_patience_seconds, so a
# pause to think isn't the end. false = the old fixed pause (silence_seconds).
smart_turn = true
turn_check_seconds = 0.4
turn_patience_seconds = 1.6
# input_device = "Jashan Microphone"            # e.g. use the iPhone as the mic

[budget]
# Matches the $10 monthly limit set in the Anthropic Console. At warn_at Sommus says how much is used (once a
# day); at cheap_at it switches to cheap_model until the 1st. Per-request routing was measured as a loss: caches
# are per model, so switching writes a new ~6k-token cache entry that costs more than Haiku saves.
monthly_usd = 10.0
warn_at = 0.8
cheap_at = 0.9
cheap_model = "claude-haiku-4-5"

[campus]
# Classes, rooms and deadlines for the $0 campus engine (brain/campus.py). Private, so it lives in the vault.
schedule = "~/Documents/Jashans_Brain/Courses/schedule.toml"
todo = "~/Documents/Jashans_Brain/TODO.md"

[fastpath]
# Where "what's the weather" means (free Open-Meteo lookup, no key, no model call).
place = "Waterloo"
latitude = 43.4643
longitude = -80.5204

[live]
# `sommus live`: Gemini Live hears and speaks (free AI Studio key in ~/.gemini/.env; the free tier may be used by
# Google to improve its products). Sommus keeps the wake word, the tools, the PIN and the rules. `sommus voice`
# is the fully local mode and still works.
model = "gemini-3.8-live"
voice = ""                           # "" = Google's default voice (Jashan's pick) · or one of ~30: sommus voices --gemini
persona = "butler"                   # "butler": dry, sarcastic, Alfred-style · "teen": sarcastic teenager · or write your own
style = ""                                    # how it speaks; "" for the voice's natural style
awake_seconds = 60                   # the session closes (and stops sending audio) after this long quiet
                                     # (30 meant saying the wake word again mid-conversation; 2026-11-03)
interrupt_sensitivity = "low"        # "high": any sound cuts it off · "low": it takes clear speech

[deploy]
# The always-on brain (Oracle free server) and the Mac, on Jashan's tailnet. On the server, SOMMUS_ROLE=server
# makes the nodes marked where = "mac" remote: the Mac serves them with `sommus node`.
server_host = "100.101.226.81"
api_port = 8780                  # /ask for the iPhone, only on the tailnet
mac_host = "100.76.57.64"
mac_port = 8790                  # `sommus node` on the Mac
telegram = "server"              # only one process may poll the bot; the Mac's sessions leave it to the server

[brief]
morning = "07:00"                # Telegram morning brief: classes, due soon, weather, unread mail ($0, no model)
nudge_minutes = 15               # "ECE 105 lecture in 15 minutes, E2 1792"
# Said out loud on the Mac when it's awake ("Physics in fifteen, room E2 1792."), else Telegram as above. The
# first time the Mac is awake on a morning it also says good morning and what's first. Reminders always go to
# Telegram, and are spoken too. Never during quiet_hours [from, until), or when the Mac is muted or told
# "be quiet" (set_quiet). speak = false: Telegram only.
speak = true
quiet_hours = ["23:00", "07:30"]

[gym]
# Which split day is on which weekday; the morning brief says "Gym today: Day 1." (no exercise list: that lives in the
# vault's Training/Training Hub.md). Days not listed are rest days. Split confirmed by Jashan 2026-11-09.
days = { Tue = "Day 1", Wed = "Day 2", Sat = "Day 1", Sun = "Day 2" }

[supplements]
# Nudges for supplements, from the vault's Nutrition/Supplement Log.md. At each slot's time, Sommus reads today's rows
# and speaks up (Mac when awake, else Telegram) only if something due in that slot has no row. Once per slot per day,
# and only within window_minutes of the slot's time. Item names: multivitamin, hair gummies, fish oil, k2+d3,
# creatine, magnesium, bodyarmor. Schedule confirmed with Jashan 2026-11-09; the clock times are defaults.
enabled = true
log = "Nutrition/Supplement Log.md"
window_minutes = 120
slots = [
  { name = "morning", at = "10:00", say = "morning", items = ["multivitamin", "hair gummies"] },
  { name = "bodyarmor", at = "17:00", say = "before the gym or with a meal", items = ["bodyarmor"] },
  { name = "dinner", at = "18:00", say = "around dinner", items = ["fish oil", "k2+d3"] },
  { name = "sleep", at = "22:30", say = "before bed", items = ["creatine", "magnesium"] },
]

[model_training]
# Sommus's own small model (docs/decisions/0014-own-model-nightly.md), nightly via `sommus model-nightly`.
# The data stages (export, split, synthetic requests, report) run anywhere. The fine-tune runs only on Apple
# silicon with mlx-lm and enough memory; elsewhere the report says "training: skipped (<reason>)".
enabled = true                     # false = the whole job does nothing
train = true                       # false = never fine-tune, even on a Mac that could
base_model = "mlx-community/Qwen2.5-1.5B-Instruct-4bit"   # 1-3B; Qwen2.5-3B-Instruct-4bit if memory allows
lora_rank = 8
lora_scale = 20.0
lora_dropout = 0.0
num_layers = 16                    # how many of the top layers get LoRA adapters
iters = 600
batch_size = 4
learning_rate = 1e-4
max_seq_length = 512
min_memory_gb = 16                 # below this, training is skipped
min_train_examples = 50
timeout_minutes = 90
synthetic_per_night = 40           # new generated requests per night (Haiku, schemas only, never real text)
synthetic_max_usd = 0.05           # hard cap per night, estimated from token counts
synthetic_model = ""               # "" = [budget] cheap_model
synthetic_tools_per_night = 10     # how many of the least-covered tools each night targets
vault = "~/Documents/Jashans_Brain"
note = "Portfolio/Projects/Sommus Model Progress.md"   # relative to the vault; one section a night

[voice_db]
# Shadow-mode voice-ID data (src/sommus/voicedb.py): the Mac keeps the voice embedding (256 numbers, not audio) of each
# sentence said in a live conversation, to build a voiceprint from real data later. The PIN is unchanged and nothing
# reads this to unlock anything. `sommus voice-db` shows how it is going.
collect = true
# Also keep a short WAV clip of the surest sentences (the PIN said aloud), up to max_clips, so a better model can be
# tried later without re-recording. false = numbers only.
keep_clips = true
max_clips = 200

[status]
# Tell him on Telegram once if the Mac side (live mode, Mac controls, Bluetooth plug) has been unreachable this long,
# but only between these hours (a closed lid overnight is normal). He also gets one message when it comes back.
# "How's Sommus doing?" (spoken or typed) and /status on Telegram give the same picture for free.
mac_alert_minutes = 30
alert_from_hour = 10
alert_until_hour = 23

# Scenes (src/sommus/scenes.py): one phrase, several devices, no model ($0). Say the scene's name or one of its
# phrases on its own ("goodnight", "run study mode", "start my goodnight scene"); "what scenes do I have" lists them.
# Each step: tool + args, and optionally device ("mac" | "phone" | "home" | "server", default: whoever owns the tool),
# done (said when it worked), label (named when it didn't), fallback (+ fallback_args) tried if the tool fails, or
# any = [ {tool...}, {tool...} ] to use the first whose device is there, the one he's talking from first.
# Steps on different devices run at the same time; on one device in the order written. A step that needs the PIN or
# a yes/no is skipped and named, never asked halfway. Phone steps happen only through the Action Button. Edits work
# without a restart.
[scenes.goodnight]
phrases = ["good night", "bedtime", "night night"]
say = "Goodnight."
steps = [
    { tool = "plug_off", args = { plug = "lamp" }, fallback = "ble_plug_off", label = "Lamp", done = "lamp off" },
    { tool = "set_quiet", args = { on = true }, done = "Mac quiet" },
    { tool = "sleep_display", done = "Mac screen off" },
    { tool = "phone_focus", args = { mode = "Sleep" }, done = "Sleep Focus on" },
]

[scenes.study]
name = "study mode"
phrases = ["study time", "time to study"]
say = "Study mode. Go get it."
steps = [
    { tool = "set_quiet", args = { on = true }, done = "Mac quiet" },
    { tool = "set_volume", args = { level = 20 }, done = "volume 20" },
    { tool = "open_app", args = { name = "Visual Studio Code" }, done = "VS Code open" },   # change to the app you study in
    { tool = "phone_focus", args = { mode = "Do Not Disturb" }, done = "Do Not Disturb on" },
]

[scenes.leaving]
name = "I'm leaving"
phrases = ["I'm leaving", "I'm heading out", "heading out", "leaving now"]
steps = [
    { tool = "plug_off", args = { plug = "lamp" }, fallback = "ble_plug_off", label = "Lamp", done = "lamp off" },
    { tool = "lock_screen", done = "Mac locked" },
]
