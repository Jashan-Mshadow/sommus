[assistant]
name = "Sommus"
user = "Jashan"
model = "claude-sonnet-5"
# low | medium | high | xhigh | max — lower is faster and cheaper.
# Sonnet 5 + low chosen 2026-09-14 for cost; see the eval numbers in the vault plan.
effort = "low"
# Soft step budget: Sommus is warned when it's running low, and takes more if it
# genuinely needs them (announced). max_steps_hard is the real ceiling.
max_steps = 20
max_steps_hard = 60
# The server-side search tool is off: attached to every request it was 2,440 tokens (~30% of
# the prompt). Search now lives in the "web" node below and only costs anything when used.
web_search = false
# Only these tools are sent with every request. The rest are found on demand by tool
# search, so the prompt stays small — 59 full tool definitions cost ~7k tokens a step.
core_tools = [
    "get_battery", "get_volume", "set_volume", "set_mute", "set_brightness", "list_apps", "open_app",
    "quit_app", "open_url", "media_control", "notify", "create_reminder", "find_contact", "send_message",
    "send_email", "search_email", "search_vault", "read_note", "add_todo", "web_search", "ask_claude",
    # quick spoken requests: deferred, each first cost a tool search (~2 s before the tool ran)
    "get_now_playing", "get_brightness", "lock_screen", "sleep_display", "get_wifi", "list_browser_tabs",
]
# Conversation memory: older turns beyond this are dropped so every request doesn't
# keep re-sending the whole day. /new clears it entirely.
history_turns = 12
# Simple fixed commands ("brightness 20", "mute", "pause", "lock") run locally with no model
# call at all — free and instant. Anything less exact still goes to the model.
fast_path = true

# Each node is an MCP server, launched as `python -m <module>`.
[[nodes]]
name = "laptop"
module = "sommus.nodes.laptop.server"
# Quitting the terminal Sommus runs in would kill Sommus mid-command.
env = { SOMMUS_PROTECT_APPS = "Terminal,iTerm2,Ghostty,Warp,Alacritty,kitty,Claude,Code,Cursor" }

[safety]
# false: Sommus acts without asking (Jashan's choice, 2026-09-14).
# true: destructive tools (quit_app, sleep_computer...) wait for a y/N first.
ask_before_destructive = false

# Needs GMAIL_ADDRESS and GMAIL_APP_PASSWORD in .env (app password, not the account
# password). Until then its tools just explain the setup; everything else keeps working.
[[nodes]]
name = "gmail"
module = "sommus.nodes.gmail.server"
env = { GMAIL_ADDRESS = "${GMAIL_ADDRESS}", GMAIL_APP_PASSWORD = "${GMAIL_APP_PASSWORD}" }

# Web search through a cheap worker model; results stay in its context, a short answer comes back.
[[nodes]]
name = "web"
module = "sommus.nodes.web.server"
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}" }

# Claude Code on this Mac, on the subscription: Google Calendar, Drive, Notion, Goodnotes, its memory of Jashan.
# Full rights (Jashan, 2026-09-15); ask_claude is behind the PIN in [security].
[[nodes]]
name = "claude"
module = "sommus.nodes.claude.server"
env = { SOMMUS_CLAUDE_MODEL = "sonnet", SOMMUS_CLAUDE_CWD = "~/Documents" }

[[nodes]]
name = "vault"
module = "sommus.nodes.vault.server"
env = { SOMMUS_VAULT_PATH = "~/Documents/Jashans_Brain" }

# Override any tool's permission tier: "read" | "reversible" | "destructive" | "blocked"
[permissions]
# Jashan's call (2026-09-14): Sommus never asks, for anything, on any device.
# Outward-facing actions (send_message, compose_email with send=true) run like the rest.
# The "always_ask" tier still exists in code if a future tool ever earns it.

[security]
# Personal actions wait for Jashan's PIN until Sommus recognises his voice (2026-09-15).
# Set it with `sommus pin` (only a salted hash is stored). Say or type it to unlock; /lock locks again,
# and so does locking or sleeping the Mac. Anything not listed — volume, music, apps, weather — never asks.
unlock_minutes = 10
pin_tools = [
    # accounts and people
    "ask_claude", "search_email", "read_email", "send_email", "reply_to_email", "draft_email", "mark_email_read",
    "send_message", "compose_email", "find_contact", "list_contacts",
    # notes
    "search_vault", "read_note", "list_notes", "append_to_note", "add_todo", "commit_vault",
    # files, clipboard, browser contents
    "read_file", "find_files", "append_to_file", "open_file", "read_pdf", "download_url", "get_clipboard",
    "list_browser_tabs", "read_browser_tab", "list_page_links", "click_page_link", "list_embedded_files",
    "save_browser_tab",
    # anything that could do all of the above another way
    "run_shell", "type_text", "press_keys", "click", "screenshot",
]

[voice]
# Spoken, course codes become subjects: "ECE105 LEC 001" -> "physics lecture". The screen keeps the codes.
say_as = { "ECE 150" = "programming", "ECE 105" = "physics", "ECE 190" = "engineering profession", "ECE 198" = "project studio", "MATH 115" = "linear algebra", "MATH 117" = "calculus", "COMMST 192" = "communications", "GENE 119" = "engineering seminar" }
engine = "kokoro"                               # "kokoro" = natural, free, runs on the Mac · "say" = built-in macOS voice
kokoro_voice = "bf_isabella"                    # picked by ear; af_heart a close second · hear others: `sommus voices`
speed = 1.0                                     # 1.1 talks a little faster
kokoro_model = "mlx-community/Kokoro-82M-bf16"  # ~330 MB, downloaded once
# Fallback if Kokoro can't load. Any installed macOS voice: `say -v '?'`.
say_voice = "Samantha (Enhanced)"
say_rate = 190                                  # words per minute
stt_model = "mlx-community/whisper-small.en-mlx"  # runs on the M1, ~0.35s per command
silence_seconds = 0.7                           # how long a pause ends what you're saying
hold_seconds = 2.0                              # ...unless it stopped mid-thought ("remind me to"): wait this long for the rest
wake_phrases = ["sommus", "hey sommus", "what's up sommus", "yo sommus"]  # at the start or end of what's said
awake_seconds = 10                              # after a reply, how long it keeps listening without the wake phrase
barge_in = false                                # talk over Sommus to stop it (echo cancellation). Off until tested with sound
room_filter = true                              # awake, check with a fast model that speech was meant for Sommus
vad_threshold = 0.5                             # speech detector; raise toward 0.7 if noise keeps waking Whisper
# input_device = "Jashan Microphone"            # e.g. use the iPhone as the mic

[fastpath]
# Where "what's the weather" means (free Open-Meteo lookup, no key, no model call).
place = "Waterloo"
latitude = 43.4643
longitude = -80.5204
