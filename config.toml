[assistant]
name = "Sommus"
user = "Jashan"
model = "claude-sonnet-5"
# low | medium | high | xhigh | max — lower is faster and cheaper.
# Sonnet 5 + low chosen 2026-09-14 for cost; see the eval numbers in the vault plan.
effort = "low"
# Soft step budget: Sommus is warned when it's running low, and takes more if it
# genuinely needs them (announced). max_steps_hard is the real ceiling.
max_steps = 20
max_steps_hard = 60
# The server-side search tool is off: attached to every request it was 2,440 tokens (~30% of
# the prompt). Search now lives in the "web" node below and only costs anything when used.
web_search = false
# Only these tools are sent with every request. The rest are found on demand by tool
# search, so the prompt stays small — 59 full tool definitions cost ~7k tokens a step.
core_tools = [
    "get_battery", "get_volume", "set_volume", "set_mute", "set_brightness", "list_apps", "open_app",
    "quit_app", "open_url", "media_control", "notify", "create_reminder", "find_contact", "send_message",
    "send_email", "search_email", "search_vault", "read_note", "add_todo", "web_search",
]
# Conversation memory: older turns beyond this are dropped so every request doesn't
# keep re-sending the whole day. /new clears it entirely.
history_turns = 12
# Simple fixed commands ("brightness 20", "mute", "pause", "lock") run locally with no model
# call at all — free and instant. Anything less exact still goes to the model.
fast_path = true

# Each node is an MCP server, launched as `python -m <module>`.
[[nodes]]
name = "laptop"
module = "sommus.nodes.laptop.server"
# Quitting the terminal Sommus runs in would kill Sommus mid-command.
env = { SOMMUS_PROTECT_APPS = "Terminal,iTerm2,Ghostty,Warp,Alacritty,kitty,Claude,Code,Cursor" }

[safety]
# false: Sommus acts without asking (Jashan's choice, 2026-09-14).
# true: destructive tools (quit_app, sleep_computer...) wait for a y/N first.
ask_before_destructive = false

# Needs GMAIL_ADDRESS and GMAIL_APP_PASSWORD in .env (app password, not the account
# password). Until then its tools just explain the setup; everything else keeps working.
[[nodes]]
name = "gmail"
module = "sommus.nodes.gmail.server"
env = { GMAIL_ADDRESS = "${GMAIL_ADDRESS}", GMAIL_APP_PASSWORD = "${GMAIL_APP_PASSWORD}" }

# Web search through a cheap worker model; results stay in its context, a short answer comes back.
[[nodes]]
name = "web"
module = "sommus.nodes.web.server"
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}" }

[[nodes]]
name = "vault"
module = "sommus.nodes.vault.server"
env = { SOMMUS_VAULT_PATH = "~/Documents/Jashans_Brain" }

# Override any tool's permission tier: "read" | "reversible" | "destructive" | "blocked"
[permissions]
# Jashan's call (2026-09-14): Sommus never asks, for anything, on any device.
# Outward-facing actions (send_message, compose_email with send=true) run like the rest.
# The "always_ask" tier still exists in code if a future tool ever earns it.
