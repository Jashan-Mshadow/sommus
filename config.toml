[assistant]
name = "Sommus"
user = "Jashan"
model = "claude-opus-5"
# low | medium | high | xhigh | max — lower is faster and cheaper. The eval decides.
effort = "medium"
# Most model↔tool round trips allowed per command.
max_steps = 12

# Each node is an MCP server, launched as `python -m <module>`.
[[nodes]]
name = "laptop"
module = "sommus.nodes.laptop.server"

# Override any tool's permission tier: "read" | "reversible" | "destructive" | "blocked"
[permissions]
# open_url = "destructive"
